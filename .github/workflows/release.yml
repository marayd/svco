name: Release

# Publishes every Stonecutter build (Fabric, Forge and NeoForge for each
# Minecraft version) to Modrinth and CurseForge and attaches the jars to a
# GitHub Release.
#
#   git tag v1.0.1 && git push origin v1.0.1    -> release channel
#   git tag v1.1.0-beta.1 && git push ...       -> beta channel
#   Actions -> Release -> Run workflow          -> pick version + channel manually
#
# Requires the repository secrets
#   MODRINTH_TOKEN    a Modrinth PAT with "Create versions" scope
#   CURSEFORGE_TOKEN  a CurseForge API token (https://legacy.curseforge.com/account/api-tokens)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version, without the leading v (default: mod_version from gradle.properties)'
        required: false
        type: string
      version_type:
        description: 'Release channel (Modrinth version type / CurseForge release type)'
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      platforms:
        description: 'Where to publish (re-run a failed upload on one site without duplicating the other)'
        required: true
        default: all
        type: choice
        options:
          - all
          - modrinth
          - curseforge
      nodes:
        description: 'Only these nodes, comma separated (e.g. 26.2-fabric,26.1.2-fabric); empty = all'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build everything and print the Modrinth/CurseForge payloads without publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Never let two releases upload at the same time, and never cancel
# a run halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: '25'

jobs:
  prepare:
    name: Resolve version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_type: ${{ steps.meta.outputs.version_type }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the changelog can diff against the previous tag

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VERSION_TYPE: ${{ inputs.version_type }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            version="${TAG_NAME#v}"
            # Pre-release suffixes decide the channel.
            case "$version" in
              *alpha*)      version_type=alpha ;;
              *beta*|*rc*)  version_type=beta ;;
              *)            version_type=release ;;
            esac
            dry_run=false
          else
            version="$INPUT_VERSION"
            if [ -z "$version" ]; then
              version="$(sed -n 's/^mod_version=//p' gradle.properties)"
            fi
            version_type="$INPUT_VERSION_TYPE"
            dry_run="$INPUT_DRY_RUN"
          fi

          if [ -z "$version" ]; then
            echo "::error::Could not resolve a version to publish"
            exit 1
          fi

          echo "version=$version"           >> "$GITHUB_OUTPUT"
          echo "version_type=$version_type" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run"           >> "$GITHUB_OUTPUT"

          {
            echo "### Release $version"
            echo "- channel: \`$version_type\`"
            echo "- dry run: \`$dry_run\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate changelog
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Re-publishing a version that already has a GitHub Release (e.g. to
          # a newly added site) reuses its notes instead of the commits since.
          if [ "$EVENT_NAME" != "push" ] \
            && gh release view "v$VERSION" --repo "${{ github.repository }}" --json body -q .body > CHANGELOG_RELEASE.md 2>/dev/null; then
            cat CHANGELOG_RELEASE.md
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            head_ref="$TAG_NAME"
            previous="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
          else
            head_ref="HEAD"
            previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi

          {
            echo "## $VERSION"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty=format:'- %s' "${previous}..${head_ref}"
              echo
              echo
              echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${previous}...${head_ref}"
            else
              git log --no-merges --pretty=format:'- %s' "$head_ref"
              echo
            fi
          } > CHANGELOG_RELEASE.md

          cat CHANGELOG_RELEASE.md

      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG_RELEASE.md
          retention-days: 7

  publish:
    name: MC ${{ matrix.minecraft }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # One broken Minecraft version must not block the others; re-run the
      # failed leg afterwards.
      fail-fast: false
      matrix:
        minecraft:
          - '1.20.1'
          - '1.20.4'
          - '1.20.6'
          - '1.21.1'
          - '1.21.4'
          - '1.21.5'
          - '1.21.8'
          - '1.21.10'
          - '1.21.11'
          - '26.1.2'
          - '26.2'
          - '26.3'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Drop the developer's local JDK path
        # gradle.properties pins org.gradle.java.home to a Windows path; on the
        # runner the JDK from setup-java is the right one.
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Select nodes
        id: nodes
        env:
          MC: ${{ matrix.minecraft }}
          NODES: ${{ inputs.nodes }}
        run: |
          set -euo pipefail
          # Every loader node of this Minecraft version: versions/<mc>-<loader>,
          # narrowed to the `nodes` input on a manual run that sets it
          selected=()
          for dir in versions/"$MC"-*/; do
            node="$(basename "$dir")"
            if [ -n "$NODES" ] && [[ ",${NODES// /}," != *",$node,"* ]]; then
              continue
            fi
            selected+=("$node")
          done
          if [ ${#selected[@]} -eq 0 ]; then
            echo "No selected nodes for Minecraft $MC"
          fi
          echo "list=${selected[*]}" >> "$GITHUB_OUTPUT"

      - name: Build and publish to Modrinth
        if: steps.nodes.outputs.list != '' && (inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'modrinth')
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SVCO_CHANGELOG_FILE: CHANGELOG_RELEASE.md
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_TYPE: ${{ needs.prepare.outputs.version_type }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          NODES: ${{ steps.nodes.outputs.list }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          tasks=()
          for node in $NODES; do tasks+=(":$node:modrinth"); done
          ./gradlew --no-daemon --stacktrace "${tasks[@]}" \
            -Pmod_version="$VERSION" \
            -Pmodrinth_version_type="$VERSION_TYPE" \
            -Pmodrinth_debug="$DRY_RUN"

      - name: Build and publish to CurseForge
        # Runs even if the Modrinth upload failed, so one site's outage does
        # not hold back the other; re-run with `platforms` for the failed one.
        if: ${{ !cancelled() && steps.nodes.outcome == 'success' && steps.nodes.outputs.list != '' && (inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'curseforge') }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          SVCO_CHANGELOG_FILE: CHANGELOG_RELEASE.md
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_TYPE: ${{ needs.prepare.outputs.version_type }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          NODES: ${{ steps.nodes.outputs.list }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          tasks=()
          for node in $NODES; do tasks+=(":$node:curseforge"); done
          ./gradlew --no-daemon --stacktrace "${tasks[@]}" \
            -Pmod_version="$VERSION" \
            -Pmodrinth_version_type="$VERSION_TYPE" \
            -Pcurseforge_debug="$DRY_RUN"

      - uses: actions/upload-artifact@v7
        with:
          name: svco-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}-*/build/libs/*.jar
            !versions/${{ matrix.minecraft }}-*/build/libs/*-sources.jar
          # A run narrowed by `nodes` builds nothing for the other versions
          if-no-files-found: ${{ inputs.nodes != '' && 'ignore' || 'error' }}

  github-release:
    name: GitHub Release
    needs: [prepare, publish]
    # A single-site re-run leaves the existing GitHub Release alone
    if: needs.prepare.outputs.dry_run != 'true' && (inputs.platforms == '' || inputs.platforms == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: svco-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: List artifacts
        run: find dist -name '*.jar' | sort

      - uses: softprops/action-gh-release@v3
        with:
          # On a manual run this creates the tag on the triggering commit.
          tag_name: v${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          prerelease: ${{ needs.prepare.outputs.version_type != 'release' }}
          # Each artifact keeps its <mc>-<loader>/build/libs/ layout
          files: dist/**/*.jar
          fail_on_unmatched_files: true
