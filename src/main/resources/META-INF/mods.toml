modLoader = "javafml"
loaderVersion = "*"
license = "All rights reserved"

[[mods]]
modId = "svco"
version = "${version}"
displayName = "Simple Voice Online"
authors = "mryd"
description = '''Client addon for Simple Voice Chat: when the server has no voice chat installed, routes voice through a standalone relay server so addon users can still talk.'''
logoFile = "assets/svco/icon.png"
# Client-side only: never make a server look incompatible in the server list
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.svco]]
modId = "forge"
mandatory = true
versionRange = "${loader_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.svco]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.svco]]
modId = "voicechat"
mandatory = true
versionRange = "${voicechat_range}"
ordering = "AFTER"
side = "BOTH"
